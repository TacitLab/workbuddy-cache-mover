name: Cross-platform safety checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.8'
          - os: windows-latest
            python: '3.13'
          - os: macos-15-intel
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Check temporary-directory migrations and native launchers
        run: python -X utf8 -m unittest discover -s scripts -p "test_*.py" -v
      - name: Compare fixed small-file copying against previous release
        run: python -X utf8 scripts/benchmark_io.py --count 8000 --output io-benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: io-benchmark-${{ matrix.os }}-${{ matrix.python }}
          path: io-benchmark.json
